# サイト本番用オーバーライド(VPS で Caddy を 80/443 で公開)
#
# ⚠ 2026-10-07 時点で、この override はどの host でも使っていない。
#   公開サイトは web host (edge CDN 背後) が配信し、validator host の Caddy は
#   docker-compose.behind-proxy.yml + docker-compose.ops-tunnel.yml (loopback のみ)。
#   validator host でこれを使うと 80/443 を公開し、届かない ACME を回し続ける。
#
# 起動:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 前提:
#   - .env に DOMAIN(=metal.freedom-yield.com) と ACME_EMAIL(Let's Encrypt 連絡先)を設定済
#   - VPS の 80/443/TCP と 443/UDP(HTTP/3) が inbound 許可済
#   - edge DNS A レコード metal -> VPS IP が設定済
#
# 注意:
#   - 本ファイルは「サイト = Caddy 静的配信」だけを扱う
#   - validator(metalgo)は docker-compose.metalgo.yml で別管理、deploy で再起動しない

services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
      # ops dashboard: 127.0.0.1 bind = SSH tunnel only, never public
      - "127.0.0.1:8443:8443"
    environment:
      - DOMAIN=${DOMAIN:-metal.freedom-yield.com}
      - ACME_EMAIL=${ACME_EMAIL:?ACME_EMAIL is required for production (Let's Encrypt account)}
      - OPS_BASIC_AUTH_HASH=${OPS_BASIC_AUTH_HASH:?OPS_BASIC_AUTH_HASH (bcrypt) required for ops dashboard}
