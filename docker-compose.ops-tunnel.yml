# validator host 専用: ops dashboard (Caddyfile の :8443 ブロック) を SSH トンネル
# 経由でだけ見えるようにする override。
#
# validator host の Caddy は 1 つだけ (container caddy-static, project site,
# custom image caddy-static:local)。deploy.yml の「Bring up / reload Caddy on VPS」が
# 次の 3 本で起動・再作成する:
#   docker compose -f docker-compose.yml -f docker-compose.behind-proxy.yml \
#     -f docker-compose.ops-tunnel.yml up -d --build
#
# この override が足すもの:
#   - 127.0.0.1:8443 → container :8443 (loopback のみ。0.0.0.0 にしない)
#     公開ポート 80/443 は bind しない: 公開サイトは web host (edge CDN 背後) が配信し、
#     validator host の 80/443 には正規の閲覧者が来ない (2026-10-07 実測)。
#   - OPS_BASIC_AUTH_HASH: behind-proxy の dummy hash を host .env の本物で上書きする。
#     .env に無ければ compose が起動を拒否する (fail closed — 認証の無い / 誰も知らない
#     hash の dashboard を黙って立てない)。
#
# アクセス: ssh -L 8443:localhost:8443 で validator host に入り、http://localhost:8443
# 防御: ① loopback bind ② SSH 鍵認証 ③ Caddy BasicAuth
#
# 経緯 (2026-10-07): 以前は別 container (stock image、docker-compose.prod.yml で
# 80/443 + 8443 を bind) が ops dashboard を出していた。Caddyfile が rate_limit
# プラグインを使うようになった後も再起動されずに古い設定で動き続け、再起動で
# "rate_limit is not a registered directive" により起動不能になった。
# deploy が管理する custom image の Caddy に寄せ、Caddy を 1 つにした。

services:
  caddy:
    ports:
      - "127.0.0.1:8443:8443"
    environment:
      - OPS_BASIC_AUTH_HASH=${OPS_BASIC_AUTH_HASH:?OPS_BASIC_AUTH_HASH (bcrypt) is required in the host .env for the ops dashboard}
