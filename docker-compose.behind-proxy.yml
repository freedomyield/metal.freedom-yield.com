# Behind reverse proxy mode — 既存の host nginx が
# metal.freedom-yield.com の TLS 終端 + Host ベースルーティングを担う構成
# (two-host topology)。
#
# このoverride を使うとき:
#   - 80 / 443 を bind しない(host port は使わない)
#   - Caddy は 127.0.0.1:${BEHIND_PROXY_PORT:-8085} のみで plain HTTP 受け
#   - TLS / Let's Encrypt は前段が処理(ACME_EMAIL は不要)
#   - DOMAIN=:80(Caddy は Host にマッチさせず port 80 で listen)
#
# 起動(validator host。deploy.yml の Caddy ステップと同じ 2 本):
#   docker compose -f docker-compose.yml -f docker-compose.behind-proxy.yml up -d --build
#   (-f を明示することで docker-compose.override.yml は読まれない)
#   validator host では 127.0.0.1:8085 の前段に nginx は居ない(deploy の health check
#   だけが叩く)。公開サイトは web host が配信する。
#
# host nginx 側の reverse proxy 設定は docs/DEPLOY_SETUP.md 参照。

services:
  caddy:
    ports:
      - "127.0.0.1:${BEHIND_PROXY_PORT:-8085}:80"
    environment:
      - DOMAIN=:80
      # 前段が TLS を終端するので ACME 関連は無効
      - ACME_EMAIL=behind-proxy@invalid.local
