name: Secret scan (unconditional main push)

# R6: validate.yml's gitleaks job (`secret-scan`) is gated
# `push: branches-ignore: [main]`, so it never runs on a push to main.
# deploy.yml's own `secret-scan` job (the push-to-main gate) inherits
# deploy.yml's `on: push: paths-ignore: [README.md, README.ja.md,
# .gitignore, CLAUDE.md, docs/**]` -- so a docs-only push straight to main
# is never scanned by either workflow.
#
# This workflow closes that gap: it triggers on every push to main with NO
# paths-ignore, so every commit that lands on main is gitleaks-scanned
# somewhere. It is an INDEPENDENT check -- it does not gate or feed the
# deploy pipeline, so a red run here never blocks a deploy (deploy.yml keeps
# its own `secret-scan` gate unchanged).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: gitleaks (unconditional main push, no paths-ignore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks against full history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
