name: CI (unconditional main push)

# R6 + R8: two coverage gaps on the push-to-main path.
#
# R6 (secret scan): validate.yml's gitleaks job (`secret-scan`) is gated
# `push: branches-ignore: [main]`, so it never runs on a push to main.
# deploy.yml's own `secret-scan` job (the push-to-main gate) inherits
# deploy.yml's `on: push: paths-ignore: [README.md, README.ja.md,
# .gitignore, CLAUDE.md, docs/**]` -- so a docs-only push straight to main
# was never scanned by either workflow.
#
# R8 (test suite): validate.yml's `tests` job (bash tests/run-all-tests.sh)
# lives under the same `push: branches-ignore: [main]` gate as its gitleaks
# job, so the repo's test suite never runs in CI on a direct push to main
# either.
#
# This workflow closes both gaps: it triggers on every push to main with NO
# paths-ignore, so every commit that lands on main is both gitleaks-scanned
# and test-suite-checked somewhere. It is an INDEPENDENT check -- neither
# job gates or feeds the deploy pipeline (no `needs`, deploy.yml untouched),
# so a red run here never blocks a deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    name: gitleaks (unconditional main push, no paths-ignore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI (license-free; the marketplace action requires a paid GITLEAKS_LICENSE for org repos)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks against full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --no-banner

  tests:
    name: repo test suites (unconditional main push, no paths-ignore)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up schema validator (sanctioned installer; tests/run-all-tests.sh preflight requires ajv or python3+jsonschema)
        run: bash scripts/setup-schema-validator.sh
      - name: bash tests/run-all-tests.sh
        run: bash tests/run-all-tests.sh
      - name: Check external link rel/target attributes
        run: bash scripts/apply-external-link-attrs.sh --check public
      # Same gate as validate.yml's `identity artifact pins` step, duplicated
      # here for the same reason R6/R8 above are duplicated: validate.yml is
      # gated `push: branches-ignore: [main]`, so a commit pushed straight to
      # main would otherwise never have its identity pins checked — and a
      # direct push to main is exactly how 7dfc3c4 landed the schema edit that
      # broke the signed manifest on 2026-08-05.
      - name: identity artifact pins still describe the repo
        run: bash scripts/check-identity-pins.sh --mode=repo

  publish-guard:
    name: publish-guard (host identifier / PII) on pushed diff, fail-closed
    # scripts/publish-guard.sh is enforced today only inside git hooks
    # (.githooks/pre-commit, .githooks/pre-push), which are opt-in per clone
    # (core.hooksPath is never committed). A push from a clone without hooks
    # installed reaches main with ZERO layers of this guard having run. This
    # job is the CI-side backstop: it re-scans the diff that actually landed
    # on main, independent of whatever the pushing clone had configured.
    # Mirrored in validate.yml (branches-ignore: [main]) for the same reason
    # the other two mirrored jobs above are duplicated here — see their
    # comments. A red run here never blocks deploy.yml (no `needs`).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run publish-guard --diff against the pushed diff (fail-closed)
        env:
          EVT_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GUARD="scripts/publish-guard.sh"

          # Fail-closed: an absent/non-executable guard must STOP the job,
          # never be treated as "nothing to check, so allow". A guard this
          # repo cannot run is a guard that caught nothing.
          if [ ! -x "$GUARD" ]; then
            echo "::error::${GUARD} is missing or not executable — cannot scan, failing closed." >&2
            exit 1
          fi

          ZERO="0000000000000000000000000000000000000000"
          BASE="${EVT_BEFORE:-}"

          if [ -n "$BASE" ] && [ "$BASE" != "$ZERO" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "publish-guard: scanning pushed diff ${BASE}..${HEAD_SHA}"
            if ! git diff -U0 "${BASE}" "${HEAD_SHA}" | "$GUARD" --diff; then
              echo "::error::publish-guard detected a forbidden host identifier / PII literal in the pushed diff (see log above)." >&2
              exit 1
            fi
          else
            # No usable prior SHA (branch creation, force-push whose old tip
            # is gone, or a shallow-history edge case) — a diff cannot be
            # computed. Do NOT skip: fall back to scanning every tracked
            # file's current content so this run still means something.
            echo "publish-guard: no usable prior SHA for a diff — scanning the full tracked tree instead of skipping."
            if ! git ls-files -z | xargs -0 cat -- | "$GUARD" --text; then
              echo "::error::publish-guard detected a forbidden host identifier / PII literal in the tracked tree (see log above)." >&2
              exit 1
            fi
          fi
          echo "publish-guard: clean."
