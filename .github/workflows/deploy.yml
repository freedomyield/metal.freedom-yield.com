name: Deploy site to VPS

# 必要な GitHub Secrets:
#   SSH_HOST     - VPS の IP or ホスト名
#   SSH_USER     - SSH ユーザー(例: <deploy_user>)
#   SSH_KEY      - 秘密鍵(OpenSSH PEM 形式、改行込みでそのまま貼り付け)
#   SSH_PORT     - SSH ポート(任意、未設定なら 22)
#   DEPLOY_PATH  - VPS 上のリポジトリパス(例: <deploy_path>)
#
# 必要な Repository Variable(secrets ではなく variables):
#   DEPLOY_ENABLED=true - これが true になるまで全 job が skip される
#                         (VPS 契約前は未設定にしておく、CI が赤くならない)
#
# 設定場所:
#   Settings → Secrets and variables → Actions
#   - "Secrets" タブで SSH_* / DEPLOY_PATH を登録
#   - "Variables" タブで DEPLOY_ENABLED=true を設定
#
# 詳細は docs/DEPLOY_SETUP.md を参照

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'README.ja.md'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  secret-scan:
    # validate.yml's gitleaks job (`secret-scan`) never runs for pushes to
    # main (`push: branches-ignore: [main]`) — this is the only path a
    # direct push to main actually takes through CI. Runs unconditionally
    # (not gated on DEPLOY_ENABLED) so main stays scanned even before a VPS
    # is contracted / deploy is enabled.
    name: gitleaks (push-to-main gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI (license-free; the marketplace action requires a paid GITLEAKS_LICENSE for org repos)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks against full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --no-banner

  deploy:
    # VPS 未契約期間は DEPLOY_ENABLED=true を設定せず、job ごと skip する(CI 失敗扱いにしない)
    # secret-scan gate: a real secret hit blocks the deploy to the live
    # validator host, same as it already blocks local commits/pushes via
    # .githooks/pre-commit + pre-push.
    needs: secret-scan
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - name: Verify required secrets
        env:
          _SSH_HOST: ${{ secrets.SSH_HOST }}
          _SSH_USER: ${{ secrets.SSH_USER }}
          _SSH_KEY: ${{ secrets.SSH_KEY }}
          _DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=()
          [ -n "$_SSH_HOST" ]    || missing+=("SSH_HOST")
          [ -n "$_SSH_USER" ]    || missing+=("SSH_USER")
          [ -n "$_SSH_KEY" ]     || missing+=("SSH_KEY")
          [ -n "$_DEPLOY_PATH" ] || missing+=("DEPLOY_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing required GitHub Secrets: ${missing[*]}"
            echo "::error::see docs/DEPLOY_SETUP.md and set them at https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions"
            exit 1
          fi
          # SSH_KEY 以外はトリム(改行混入の事故対策)、SSH_KEY は改行を保持
          echo "SSH_HOST=$(printf '%s' "$_SSH_HOST" | xargs)"       >> $GITHUB_ENV
          echo "SSH_USER=$(printf '%s' "$_SSH_USER" | xargs)"       >> $GITHUB_ENV
          echo "DEPLOY_PATH=$(printf '%s' "$_DEPLOY_PATH" | xargs)" >> $GITHUB_ENV
          echo "✓ all required secrets are set"

      - uses: actions/checkout@v7

      - name: Cache-bust assets URL with current commit hash
        # edge CDN PoP / browser cache 対策。
        # HTML が直接参照する各 JS / CSS の URL に commit hash を付与する。
        # 各エントリポイントを忘れずに列挙すること(prior oversights)
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          # JS は <script src="..."> なので src= で検出
          for asset in "assets/main.js" "assets/hero-3d/main.js" "assets/bg-3d.js"; do
            find public -name "*.html" -exec \
              sed -i -E "s|src=\"/${asset}[^\"]*\"|src=\"/${asset}?v=${SHORT_SHA}\"|g" \
              {} +
            N=$(grep -rl "${asset}?v=${SHORT_SHA}" public/ | wc -l | tr -d ' ')
            echo "${N} HTML files reference /${asset}?v=${SHORT_SHA}"
          done
          # CSS は <link rel="stylesheet" href="..."> なので href= で検出
          for asset in "styles.css"; do
            find public -name "*.html" -exec \
              sed -i -E "s|href=\"/${asset}[^\"]*\"|href=\"/${asset}?v=${SHORT_SHA}\"|g" \
              {} +
            N=$(grep -rl "${asset}?v=${SHORT_SHA}" public/ | wc -l | tr -d ' ')
            echo "${N} HTML files reference /${asset}?v=${SHORT_SHA}"
          done

          # ESM 内の relative import('./x.js') にも cache-bust 付与。
          # main.js だけ HTML から ?v= 付きで読まれても、main.js 内の
          # `import { X } from './x.js'` は CDN cache に hit して古い
          # ものが返る事故が起きる(prior cache-version oversight)。
          # hero-3d は ESM module 群なのでここで一括 rewrite する。
          for js in public/assets/hero-3d/*.js; do
            # `from './foo.js';` → `from './foo.js?v=SHA';`
            # 既に ?v= が付いている場合は SHA だけ差し替え
            sed -i -E "s|from '\./([a-zA-Z0-9._-]+\.js)(\?v=[a-zA-Z0-9]+)?'|from './\1?v=${SHORT_SHA}'|g" "$js"
          done
          NJS=$(grep -l "?v=${SHORT_SHA}" public/assets/hero-3d/*.js 2>/dev/null | wc -l | tr -d ' ')
          echo "${NJS} hero-3d JS files have relative imports cache-busted to ?v=${SHORT_SHA}"

      - name: Set up SSH key
        env:
          _SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # CR 除去(CRLF で貼り付けられた場合の事故対策)、改行は保持
          printf '%s' "$_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          [ -z "$(tail -c 1 ~/.ssh/id_deploy)" ] || echo "" >> ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure deploy path exists
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Advance host checkout to origin/main
        # Delivery-ownership inversion (2026-07-13): git is the ONLY
        # delivery path for tracked files. We advance the host checkout
        # BEFORE any rsync so the compose/Caddy step below always runs
        # against the pushed commit's files. The script is piped from the
        # runner's checkout (bash -s) — the host executes the version this
        # push shipped, never a stale on-host copy, which also lets its
        # self-heal absorb dirt left behind by the pre-inversion rsync on
        # the very first run. Fail-closed: if the host cannot FF (real
        # local divergence, host ahead, fetch failure), the script alerts
        # via on-host ntfy AND this deploy fails loudly here.
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "FYD_REPO_DIR='$DEPLOY_PATH' FYD_NOTIFY='$DEPLOY_PATH/scripts/notify.sh' bash -s" \
            < scripts/advance-host-checkout.sh

      - name: Rsync public/ to VPS
        # ONLY the deploy-transformed public/ tree travels by rsync — it is
        # the one artifact git cannot deliver (cache-bust ?v=<sha> markers
        # are stamped into the runner's copy above, deliberately diverging
        # from the committed files; the host-side advance discards public/
        # dirt before each pull, so this never blocks git). Every other
        # tracked file reaches the host via the git advance step above.
        # This replaces the pre-2026-07-13 whole-repo rsync whose exclude
        # blacklist repeatedly leaked git-tracked files (tests/docs/TOOLKIT
        # in 07-06, CLAUDE.md + bin/ in 07-13) and broke the host's
        # ff-only pull. Feed excludes (shared SoT: deploy/feed-excludes.txt
        # via the emitter) still protect host-generated feed files from
        # --delete; empty prefix because the transfer root is public/,
        # same as the web-host public-origin leg below.
        run: |
          mapfile -t FEED_EXCLUDES < <(bash scripts/deploy/build-rsync-excludes.sh "")
          rsync -rltvz --delete --inplace \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT -o StrictHostKeyChecking=no" \
            "${FEED_EXCLUDES[@]}" \
            public/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/public/"

      - name: Bring up / reload Caddy on VPS
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && \
             docker compose -f docker-compose.yml -f docker-compose.behind-proxy.yml up -d --remove-orphans --build && \
             docker compose -f docker-compose.yml -f docker-compose.behind-proxy.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile && \
             sleep 2 && \
             curl -fsS -o /dev/null http://127.0.0.1:8085/health"

      - name: Set up Xserver deploy key
        env:
          _XS_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          XS_HOST: ${{ secrets.XSERVER_SSH_HOST }}
          XS_PORT: ${{ secrets.XSERVER_SSH_PORT }}
        run: |
          if [ -z "$_XS_KEY" ] || [ -z "$XS_HOST" ]; then
            echo "XSERVER_SSH_* secrets not set — skipping public-Xserver deploy"
            echo "(validator-host deploy already succeeded). See docs/DEPLOY_SETUP.md §5."
            exit 0
          fi
          printf '%s' "$_XS_KEY" | tr -d '\r' > ~/.ssh/id_xserver
          [ -z "$(tail -c 1 ~/.ssh/id_xserver)" ] || echo "" >> ~/.ssh/id_xserver
          chmod 600 ~/.ssh/id_xserver
          ssh-keyscan -p "$XS_PORT" "$XS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync public/ to Xserver (public origin)
        # Second deploy target: the public origin behind the edge CDN. The CI
        # key is rrsync -wo confined to the metal public dir (installed via
        # scripts/install-xserver-static-deploy-key.sh), so the remote path is
        # fixed server-side and the client targets the rrsync root ("$HOST:").
        # Same feed exclusion set as the validator-host rsync, empty prefix
        # because the source root here is public/, not the repo root. Runs
        # after the validator-host deploy has already succeeded; a failure here
        # surfaces the drift without blocking the validator host.
        env:
          XS_HOST: ${{ secrets.XSERVER_SSH_HOST }}
          XS_USER: ${{ secrets.XSERVER_SSH_USER }}
          XS_PORT: ${{ secrets.XSERVER_SSH_PORT }}
        run: |
          if [ ! -f ~/.ssh/id_xserver ] || [ -z "$XS_HOST" ]; then
            echo "Xserver deploy key absent — skipping public-origin rsync (see previous step)."
            exit 0
          fi
          mapfile -t FEED_EXCLUDES < <(bash scripts/deploy/build-rsync-excludes.sh "")
          rsync -rltvz --delete \
            -e "ssh -i ~/.ssh/id_xserver -p $XS_PORT -o StrictHostKeyChecking=no" \
            "${FEED_EXCLUDES[@]}" \
            ./public/ "$XS_USER@$XS_HOST:"

      - name: Public health check
        run: |
          sleep 3
          curl -fsS -o /dev/null https://metal.freedom-yield.com/health \
            || echo "::warning::public health check failed; check DNS / edge CDN routing"
