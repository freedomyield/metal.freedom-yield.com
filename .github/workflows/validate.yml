name: Validate

# PR と main 以外への push、および手動発火で走る軽量チェック群。
# main の push は deploy ワークフロー側で扱う。

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  json:
    name: JSON syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate all JSON
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            echo "→ $f"
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done < <(find public -name '*.json' -not -path '*/api/build.json' -not -path '*/api/validator.json')
          # JSON-LD blocks embedded in HTML
          while IFS= read -r f; do
            python3 - "$f" <<'PY' || { echo "::error file=$f::invalid JSON-LD block"; fail=1; }
          import json, re, sys
          src = open(sys.argv[1]).read()
          for m in re.finditer(r'<script type="application/ld\+json">(.+?)</script>', src, re.S):
              try:
                  json.loads(m.group(1))
              except Exception as e:
                  print("JSON-LD error:", e); sys.exit(1)
          PY
          done < <(find public -name '*.html')
          [ $fail -eq 0 ]

  caddy:
    name: Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=metal.freedom-yield.com \
            -e ACME_EMAIL=ci@example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  compose:
    name: docker compose configs
    runs-on: ubuntu-latest
    env:
      ACME_EMAIL: ci@example.com
      DOMAIN: metal.freedom-yield.com
      METAL_NETWORK: tahoe
      METAL_PUBLIC_IP: 192.0.2.1
    steps:
      - uses: actions/checkout@v7
      - name: site dev (override)
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config --quiet
      - name: site prod
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - name: metalgo local
        run: docker compose -f docker-compose.metalgo.yml config --quiet
      - name: metalgo prod
        run: docker compose -f docker-compose.metalgo.yml -f docker-compose.metalgo.prod.yml config --quiet

  html:
    name: HTML quick lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check HTML files have <title>, lang, and viewport
        run: |
          set -e
          fail=0
          for f in $(find public -name '*.html'); do
            grep -q '<title>' "$f" || { echo "::error file=$f::missing <title>"; fail=1; }
            grep -q '<html lang=' "$f" || { echo "::error file=$f::missing lang attribute"; fail=1; }
            grep -q 'name="viewport"' "$f" || { echo "::error file=$f::missing viewport meta"; fail=1; }
            grep -q 'rel="canonical"' "$f" || { echo "::warning file=$f::missing canonical link"; }
          done
          [ $fail -eq 0 ]
      - name: Check external link rel/target attributes
        run: bash scripts/apply-external-link-attrs.sh --check public

  links:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that internal links resolve to existing files
        run: |
          set -e
          fail=0
          for f in $(find public -name '*.html'); do
            # extract href values starting with / (internal only), strip query/fragment
            for href in $(grep -oE 'href="(/[^"#?]+)' "$f" | sed -E 's/href="//'); do
              # / → /index.html, /foo/ → /foo/index.html, /foo.html → /foo.html
              if [ "$href" = "/" ]; then
                target="public/index.html"
              elif [[ "$href" == */ ]]; then
                target="public${href}index.html"
              else
                target="public${href}"
              fi
              if [ ! -e "$target" ]; then
                echo "::error file=$f::broken internal link $href (expected $target)"
                fail=1
              fi
            done
          done
          [ $fail -eq 0 ]

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck on scripts/ and .githooks/
        run: |
          # shellcheck is preinstalled on ubuntu-latest
          find scripts .githooks -type f \( -name '*.sh' -o -path '.githooks/*' \) -print -exec shellcheck -x {} +

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI (license-free; the marketplace action requires a paid GITLEAKS_LICENSE for org repos)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks against full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --no-banner

  tests:
    name: repo test suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up schema validator (sanctioned installer; tests/run-all-tests.sh preflight requires ajv or python3+jsonschema)
        run: bash scripts/setup-schema-validator.sh
      - name: bash tests/run-all-tests.sh
        run: bash tests/run-all-tests.sh
      # Gate: a commit must not silently invalidate a pin inside the
      # operator-SIGNED public/api/identity.json. On 2026-08-05 an ordinary
      # schema edit (7dfc3c4) did exactly that to a manifest signed the day
      # before (90bcdd9), and nothing noticed for two days. CI cannot repair
      # it — identity.json is signed with the operator's passphrase-protected
      # key on their local Mac — so this step only detects and stops. Fix by
      # reverting the artifact change or re-issuing the manifest; see the
      # "Repairing a red run" block in scripts/check-identity-pins.sh.
      # Mirrored in ci-main.yml because this workflow ignores pushes to main.
      - name: identity artifact pins still describe the repo
        run: bash scripts/check-identity-pins.sh --mode=repo
