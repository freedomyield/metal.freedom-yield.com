<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero background — animated 3D blockchain motif.
  - Isometric cubes float and rotate gently
  - Triangulated mesh suggests peer network
  - Particles twinkle in the background
  - Animations are CSS @keyframes embedded inline so the SVG can be used
    as a CSS background-image with no external JS.
  - Honors prefers-reduced-motion via media query inside SVG <style>.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Decorative blockchain motif">
	<defs>
		<!-- Background gradient: deep navy → purple haze -->
		<linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0a0e1f" />
			<stop offset="55%" stop-color="#10152a" />
			<stop offset="100%" stop-color="#1a1138" />
		</linearGradient>
		<radialGradient id="leftHaze" cx="15%" cy="55%" r="35%">
			<stop offset="0%" stop-color="#6b3fc4" stop-opacity="0.18" />
			<stop offset="100%" stop-color="#6b3fc4" stop-opacity="0" />
		</radialGradient>
		<radialGradient id="rightHaze" cx="78%" cy="50%" r="40%">
			<stop offset="0%" stop-color="#3e63dd" stop-opacity="0.18" />
			<stop offset="100%" stop-color="#3e63dd" stop-opacity="0" />
		</radialGradient>

		<!-- Cube face gradients -->
		<linearGradient id="cubeTop" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#cad4ff" stop-opacity="0.95" />
			<stop offset="100%" stop-color="#8b9cf0" stop-opacity="0.7" />
		</linearGradient>
		<linearGradient id="cubeLeft" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#6d8ae0" stop-opacity="0.85" />
			<stop offset="100%" stop-color="#3754b4" stop-opacity="0.6" />
		</linearGradient>
		<linearGradient id="cubeRight" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#a8b8f5" stop-opacity="0.9" />
			<stop offset="100%" stop-color="#5469c8" stop-opacity="0.65" />
		</linearGradient>

		<!-- Glow filters -->
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="6" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
		<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur stdDeviation="2.5" result="blur" />
			<feMerge>
				<feMergeNode in="blur" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>

		<!-- Reusable isometric cube symbol (50px edge, centered roughly at 0,0) -->
		<symbol id="cube" viewBox="-50 -60 100 120" overflow="visible">
			<!-- Right face -->
			<path d="M 0,0 L 43,-25 L 43,35 L 0,60 Z" fill="url(#cubeRight)" stroke="#a8b8f5" stroke-opacity="0.4" stroke-width="0.5" />
			<!-- Left face -->
			<path d="M 0,0 L -43,-25 L -43,35 L 0,60 Z" fill="url(#cubeLeft)" stroke="#6d8ae0" stroke-opacity="0.4" stroke-width="0.5" />
			<!-- Top face -->
			<path d="M 0,0 L -43,-25 L 0,-50 L 43,-25 Z" fill="url(#cubeTop)" stroke="#cad4ff" stroke-opacity="0.6" stroke-width="0.5" />
			<!-- subtle glowing dot on the top edge to suggest a "node" -->
			<circle cx="0" cy="-50" r="2.5" fill="#ffffff" filter="url(#softGlow)" />
		</symbol>
	</defs>

	<!-- Inline CSS: animations + reduced-motion fallback -->
	<style>
		.cube {
			transform-origin: center;
			animation-iteration-count: infinite;
			animation-direction: alternate;
			animation-timing-function: ease-in-out;
			will-change: transform;
		}
		.c1 { animation: float1 7s, spin1 18s; animation-iteration-count: infinite; animation-direction: alternate; }
		.c2 { animation: float2 5.5s, spin2 22s; animation-iteration-count: infinite; animation-direction: alternate; }
		.c3 { animation: float3 8s, spin1 16s; animation-iteration-count: infinite; animation-direction: alternate; }
		.c4 { animation: float1 6.5s, spin2 24s; animation-iteration-count: infinite; animation-direction: alternate; animation-delay: -1s, -3s; }
		.c5 { animation: float2 9s, spin1 20s; animation-iteration-count: infinite; animation-direction: alternate; animation-delay: -2s, -5s; }
		.c6 { animation: float3 7.5s, spin2 26s; animation-iteration-count: infinite; animation-direction: alternate; animation-delay: -3s, -7s; }
		.c7 { animation: float1 5s, spin1 19s; animation-iteration-count: infinite; animation-direction: alternate; animation-delay: -1.5s, -4s; }

		@keyframes float1 {
			from { transform: translateY(0px); }
			to   { transform: translateY(-18px); }
		}
		@keyframes float2 {
			from { transform: translateY(-10px); }
			to   { transform: translateY(14px); }
		}
		@keyframes float3 {
			from { transform: translateY(8px); }
			to   { transform: translateY(-20px); }
		}
		@keyframes spin1 {
			from { transform: rotate(-3deg); }
			to   { transform: rotate(3deg); }
		}
		@keyframes spin2 {
			from { transform: rotate(2deg); }
			to   { transform: rotate(-4deg); }
		}

		.mesh-line {
			stroke: #6db5ff;
			stroke-opacity: 0.18;
			stroke-width: 0.7;
			fill: none;
		}
		.mesh-dot {
			fill: #6db5ff;
			animation: meshPulse 4s ease-in-out infinite alternate;
		}
		@keyframes meshPulse {
			from { fill-opacity: 0.3; }
			to   { fill-opacity: 0.85; }
		}

		.particle {
			fill: #ffffff;
			animation: twinkle 3.5s ease-in-out infinite alternate;
		}
		@keyframes twinkle {
			from { opacity: 0.15; }
			to   { opacity: 0.7; }
		}

		@media (prefers-reduced-motion: reduce) {
			.cube, .mesh-dot, .particle {
				animation: none !important;
			}
		}
	</style>

	<!-- Background -->
	<rect width="1600" height="600" fill="url(#bgGrad)" />
	<rect width="1600" height="600" fill="url(#leftHaze)" />
	<rect width="1600" height="600" fill="url(#rightHaze)" />

	<!-- Mesh network (right half) -->
	<g class="mesh">
		<!-- Lines (triangulated) -->
		<g class="mesh-line">
			<path d="M 820 180 L 950 130 L 1050 220 Z" />
			<path d="M 950 130 L 1080 90 L 1150 200" />
			<path d="M 1050 220 L 1180 280 L 1080 350 Z" />
			<path d="M 1080 90 L 1230 150 L 1180 280" />
			<path d="M 1230 150 L 1360 110 L 1420 220" />
			<path d="M 1180 280 L 1360 110 L 1420 220" />
			<path d="M 1080 350 L 1220 420 L 1340 360" />
			<path d="M 1180 280 L 1340 360 L 1420 220" />
			<path d="M 820 380 L 950 430 L 1080 350" />
			<path d="M 950 430 L 1080 480 L 1220 420" />
			<path d="M 1220 420 L 1340 360 L 1450 440" />
			<path d="M 1340 360 L 1480 320 L 1550 400" />
			<path d="M 1080 480 L 1240 530 L 1340 480" />
			<path d="M 950 130 L 1050 220 L 1080 90 Z" />
		</g>
		<!-- Mesh dots -->
		<circle class="mesh-dot" cx="820" cy="180" r="2.5" />
		<circle class="mesh-dot" cx="950" cy="130" r="2.5" style="animation-delay: -0.5s" />
		<circle class="mesh-dot" cx="1050" cy="220" r="2.5" style="animation-delay: -1s" />
		<circle class="mesh-dot" cx="1080" cy="90" r="2.5" style="animation-delay: -1.5s" />
		<circle class="mesh-dot" cx="1150" cy="200" r="2" style="animation-delay: -2s" />
		<circle class="mesh-dot" cx="1180" cy="280" r="2.5" style="animation-delay: -0.3s" />
		<circle class="mesh-dot" cx="1230" cy="150" r="2.5" style="animation-delay: -1.2s" />
		<circle class="mesh-dot" cx="1360" cy="110" r="2.5" style="animation-delay: -2.5s" />
		<circle class="mesh-dot" cx="1420" cy="220" r="2" style="animation-delay: -0.8s" />
		<circle class="mesh-dot" cx="1080" cy="350" r="2.5" style="animation-delay: -1.7s" />
		<circle class="mesh-dot" cx="820" cy="380" r="2" style="animation-delay: -2.2s" />
		<circle class="mesh-dot" cx="950" cy="430" r="2.5" style="animation-delay: -0.4s" />
		<circle class="mesh-dot" cx="1080" cy="480" r="2.5" style="animation-delay: -1.1s" />
		<circle class="mesh-dot" cx="1220" cy="420" r="2.5" style="animation-delay: -2.8s" />
		<circle class="mesh-dot" cx="1340" cy="360" r="2.5" style="animation-delay: -1.4s" />
		<circle class="mesh-dot" cx="1450" cy="440" r="2" style="animation-delay: -0.6s" />
		<circle class="mesh-dot" cx="1480" cy="320" r="2.5" style="animation-delay: -1.9s" />
		<circle class="mesh-dot" cx="1550" cy="400" r="2" style="animation-delay: -2.6s" />
		<circle class="mesh-dot" cx="1240" cy="530" r="2" style="animation-delay: -1.6s" />
		<circle class="mesh-dot" cx="1340" cy="480" r="2" style="animation-delay: -2.3s" />
	</g>

	<!-- Floating isometric cubes (each in its own <g> with animation class) -->
	<g class="cube c1" filter="url(#softGlow)">
		<use href="#cube" x="1100" y="220" width="120" height="144" />
	</g>
	<g class="cube c2" filter="url(#softGlow)">
		<use href="#cube" x="1280" y="350" width="90" height="108" />
	</g>
	<g class="cube c3" filter="url(#softGlow)">
		<use href="#cube" x="1380" y="170" width="70" height="84" />
	</g>
	<g class="cube c4" filter="url(#softGlow)">
		<use href="#cube" x="950" y="300" width="100" height="120" />
	</g>
	<g class="cube c5" filter="url(#softGlow)">
		<use href="#cube" x="1050" y="450" width="80" height="96" />
	</g>
	<g class="cube c6" filter="url(#softGlow)">
		<use href="#cube" x="1440" y="380" width="60" height="72" />
	</g>
	<g class="cube c7" filter="url(#softGlow)">
		<use href="#cube" x="1190" y="120" width="55" height="66" />
	</g>

	<!-- Background particles (scattered, twinkle) -->
	<g>
		<circle class="particle" cx="120" cy="140" r="1" />
		<circle class="particle" cx="220" cy="220" r="1.2" style="animation-delay: -0.5s" />
		<circle class="particle" cx="180" cy="380" r="1" style="animation-delay: -1s" />
		<circle class="particle" cx="320" cy="170" r="0.8" style="animation-delay: -1.5s" />
		<circle class="particle" cx="280" cy="450" r="1" style="animation-delay: -2s" />
		<circle class="particle" cx="450" cy="240" r="1.2" style="animation-delay: -0.8s" />
		<circle class="particle" cx="400" cy="400" r="1" style="animation-delay: -1.3s" />
		<circle class="particle" cx="550" cy="120" r="0.8" style="animation-delay: -2.2s" />
		<circle class="particle" cx="600" cy="350" r="1" style="animation-delay: -0.4s" />
		<circle class="particle" cx="680" cy="200" r="1.2" style="animation-delay: -1.6s" />
		<circle class="particle" cx="720" cy="490" r="1" style="animation-delay: -2.8s" />
		<circle class="particle" cx="540" cy="540" r="0.8" style="animation-delay: -0.9s" />
		<circle class="particle" cx="350" cy="80" r="1" style="animation-delay: -2.5s" />
		<circle class="particle" cx="60" cy="320" r="1" style="animation-delay: -1.8s" />
		<circle class="particle" cx="780" cy="80" r="1.2" style="animation-delay: -2.1s" />
		<circle class="particle" cx="850" cy="540" r="1" style="animation-delay: -0.6s" />
		<circle class="particle" cx="1180" cy="540" r="1" style="animation-delay: -1.4s" />
		<circle class="particle" cx="1500" cy="80" r="1.2" style="animation-delay: -2.7s" />
		<circle class="particle" cx="1560" cy="540" r="0.8" style="animation-delay: -0.2s" />
		<circle class="particle" cx="1380" cy="540" r="1" style="animation-delay: -1.9s" />
		<circle class="particle" cx="1530" cy="180" r="1" style="animation-delay: -2.4s" />
	</g>
</svg>
