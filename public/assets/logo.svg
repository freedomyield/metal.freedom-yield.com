<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" role="img" aria-label="Freedom Yield Metal">
	<!-- Three proton orbits, all in brand mint (CSS accent #10B386). -->
	<g fill="none" stroke="#10B386" stroke-width="2.5" stroke-linecap="round">
		<ellipse cx="0" cy="0" rx="90" ry="32" transform="rotate(22)"/>
		<ellipse cx="0" cy="0" rx="90" ry="32" transform="rotate(-28)"/>
		<ellipse cx="0" cy="0" rx="90" ry="32" transform="rotate(78)"/>
	</g>
	<!-- Central M mark in brand mint. Geometric letterform inspired by
	     Montserrat 200, the project brand font. -->
	<path d="M -36 30 L -36 -30 L 0 14 L 36 -30 L 36 30" fill="none" stroke="#10B386" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
